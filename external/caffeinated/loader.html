<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Just A Caffeinated Widget</title>
    </head>

    <body></body>

    <footer>
        <script type="module">
            // Jank fix for some busted logic in Caffeinated.
            const search = location.search.replace(
                "%D9%A8%D9%A0%D9%A9%D9%A2",
                "8092",
            );

            const queryParams = (() => {
                let vars = {};

                search.replace(/[?&]+([^=&]+)=([^&]*)/gi, (m, key, value) => {
                    vars[key] = decodeURIComponent(value);
                });

                return vars;
            })();

            const { pluginId, widgetId, authorization } = queryParams;
            const port = queryParams.port || "8092";
            const addresses = (queryParams.addresses || "localhost").split(",");

            if (queryParams.address) {
                // Old style.
                addresses.push(queryParams.address);
            }

            function testSpecialCode(address) {
                return new Promise((resolve, reject) => {
                    const specialCode = Math.random().toString(28);

                    fetch(`http://${address}:${port}/api/test/${specialCode}`)
                        .then((response) => response.text())
                        .then((result) => {
                            if (result == specialCode) {
                                resolve();
                            }
                            throw "Invalid response: " + result;
                        })
                        .catch(reject);
                });
            }

            function testOK(url) {
                return new Promise((resolve, reject) => {
                    fetch(url)
                        .then((response) => {
                            if (response.ok) {
                                resolve();
                            }
                            throw "Not OK: " + response;
                        })
                        .catch(reject);
                });
            }

            (async () => {
                for (const address of addresses) {
                    try {
                        console.debug("[widgets.casterlabs.co loader] Trying address:", `http://${address}:${port}`);
                        await testSpecialCode(address);
                        // Success!
                        console.debug("[widgets.casterlabs.co loader] Special code test successful, testing HTML endpoint...");
                        const widgetUrl = `http://${address}:${port}/api/plugin/widget/loader/widget.html${search}&validAddress=${encodeURIComponent(address)}&customCSS=`;
                        await testOK(widgetUrl);
                        console.debug("[widgets.casterlabs.co loader] HTML test successful! Redirecting...");
                        location.href = widgetUrl;
                        return;
                    } catch (e) {
                        console.debug("[widgets.casterlabs.co loader] Address failed:", e);
                    }
                }
                
                console.debug("[widgets.casterlabs.co loader] Couldn't connect to Caffeinated, retrying in 3s.");
                setTimeout(() => {
                    location.reload();
                }, 3000);
            })();
        </script>
    </footer>
</html>
